# locust.conf
[settings]
# URL base de tu aplicación
host = http://localhost:3000
# o para producción: host = https://importadoragenser.com

# Configuración para pruebas ligeras
users = 10
spawn-rate = 2
run-time = 5m

# Configuración de reportes
html = reports/report.html
csv = reports/stats

# Logging
loglevel = INFO
logfile = reports/locust.log

# Configuraciones avanzadas
# reset-stats = true
# stop-timeout = 60